##############################################################
# .github/workflows/update-profile.yml
#
# THE MASTER AUTO-UPDATE WORKFLOW
# ─────────────────────────────────────────────────────────
# Runs every day at 06:30 UTC (12:00 IST) and on every push.
#
# What it does (in order):
#   1. Runs update_readme.py → injects your latest public
#      repos into the <!-- START/END_SECTION:repos --> block
#   2. Runs gh-ascii card refresh (dark + light SVGs)
#   3. Generates snake contribution animation (dark + light)
#   4. Commits & pushes ALL changes in one atomic commit
##############################################################

name: 🤖 Auto-Update Profile

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC = 12:00 IST daily
  push:
    branches: [main]        # also run when you push new projects
  workflow_dispatch:        # manual trigger via Actions tab

permissions:
  contents: write

concurrency:
  group: auto-update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 0. Checkout ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 1. Update projects table in README ────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests

      - name: Run update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_readme.py

      # ── 2. Refresh gh-ascii ASCII profile card ────────────
      - name: Download dark ASCII card
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://gh.crafter.run/manojdailycode?theme=dark" \
            -o dark_mode.svg

      - name: Download light ASCII card
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://gh.crafter.run/manojdailycode?theme=light" \
            -o light_mode.svg

      # ── 3. Generate snake animation ───────────────────────
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: manojdailycode
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Commit all README + card changes ───────────────
      - name: Commit and push changes
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dark_mode.svg light_mode.svg
          if git diff --staged --quiet; then
            echo "✅ Nothing changed — skipping commit."
          else
            git commit -m "chore: auto-update profile [skip ci]"
            git push
            echo "🚀 Profile updated and pushed!"
          fi
